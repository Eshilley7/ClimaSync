<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClimaSync - Gestão de Funcionários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="gestao.css">
  </head>
  <body>
    <div class="layout">
      <aside class="menu">
        <div class="menu-topo">
          <div class="marca">
            <strong>ClimaSync</strong>
            <span>Estação Agroambiental</span>
          </div>
          <nav>
            <a class="menu-item" href="painel.html"><i class="bi bi-grid"></i> Painel Geral</a>
            <a class="menu-item" href="historico.html"><i class="bi bi-file-earmark-text"></i> Histórico &amp; Dados</a>
            <a class="menu-item ativo" id="linkGestao" href="gestao.html" hidden>
                <i class="bi bi-people"></i> Gestão de Funcionários
            </a>
          </nav>
        </div>

        <div class="usuario">
          <div class="avatar" id="usuarioFoto">?</div>
          <div class="usuario-info">
            <strong id="usuarioNome">Carregando...</strong>
            <span id="usuarioPerfil">Carregando perfil...</span>
          </div>
          <button class="botao-sair" id="sair" type="button" title="Sair" aria-label="Sair">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </aside>

      <main class="conteudo">
        <header class="topo">
          <h1>Gestão de Funcionários</h1>
          <div class="topo-direita">
            <button class="botao-sino" type="button" title="Notificações" aria-label="Notificações">
              <i class="bi bi-bell"></i>
            </button>
          </div>
        </header>

        <div class="pagina">
          <section class="resumo">
            <article class="caixa resumo-item">
              <div class="icone"><i class="bi bi-people"></i></div>
              <div>
                <span class="rotulo">Total de operadores cadastrados</span>
                <strong id="totalAtivos">—</strong>
              </div>
            </article>

            <article class="caixa resumo-item">
              <div class="icone azul"><i class="bi bi-shield-check"></i></div>
              <div>
                <span class="rotulo">Controle de segurança &amp; acesso</span>
                <strong id="adminPrincipal">—</strong>
              </div>
            </article>
          </section>

          <section class="caixa">
            <div class="barra">
              <label class="busca">
                <i class="bi bi-search"></i>
                <input type="search" id="busca" placeholder="Buscar por nome, e-mail ou perfil...">
              </label>
              <button class="botao-convidar" id="convidar" type="button">
                <i class="bi bi-plus-lg"></i> Convidar Operador
              </button>
            </div>

            <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

            <div class="tabela-rolagem">
              <table class="tabela" id="tabela"></table>
            </div>

            <div class="rodape-tabela">
              <span id="contagem"></span>
              <span class="verde">Logs de auditoria e atividades gerais salvos e protegidos.</span>
            </div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="dialogo">
      <form id="formulario" novalidate>
        <h3 id="dialogoTitulo">Convidar Operador</h3>

        <div class="campo">
          <label for="campoNome">Nome completo</label>
          <input id="campoNome" type="text" placeholder="Ex: Mariana Costa">
        </div>

        <div class="campo">
          <label for="campoEmail">E-mail</label>
          <input id="campoEmail" type="email" placeholder="Ex: mariana@climasync.agro">
        </div>

        <div class="campo">
          <label for="campoPerfil">Perfil de acesso</label>
          <select id="campoPerfil"></select>
        </div>

        <p class="aviso" id="avisoDialogo" role="status" aria-live="polite"></p>

        <div class="dialogo-botoes">
          <button class="botao-cancelar" id="cancelar" type="button">Cancelar</button>
          <button class="botao-convidar" id="salvar" type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="acesso-menu.js"></script>
    <script src="gestao.js"></script>
  </body>
</html>
